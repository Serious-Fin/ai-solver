name: Deploy code

on: workflow_dispatch

env:
  REGISTRY: ghrc.io
  USERNAME: ${{ github.actor }}
  PROJECT: ai-solver

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build ./frontend --tag ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.PROJECT }}-web:latest

      - name: Build API image
        run: |
          docker build ./api --tag ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.PROJECT }}-api:latest

      - name: Push frontend image to registry
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.PROJECT }}-web:latest

      - name: Push API image to registry
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.PROJECT }}-api:latest

name: Deploy code

on: workflow_dispatch

env:
  REGISTRY: ghcr.io
  REPOSITORY: "serious-fin"
  PROJECT: ai-solver

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add frontend .env file with public env vars
        run: |
          echo "PUBLIC_GOOGLE_OAUTH_CLIENT_ID=${{ secrets.PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}" >> ./frontend/.env
          echo "PUBLIC_GITHUB_OAUTH_CLIENT_ID=${{ secrets.PUBLIC_GITHUB_OAUTH_CLIENT_ID }}" >> ./frontend/.env
          echo "PUBLIC_API_BASE_URL=${{ secrets.PUBLIC_API_BASE_URL }}" >> ./frontend/.env
          echo "PUBLIC_FRONTEND_BASE_URL_BROWSER=${{ secrets.PUBLIC_FRONTEND_BASE_URL_BROWSER }}" >> ./frontend/.env

      - name: Build frontend image
        run: docker build --build-arg DISCORD_CHANNEL_ID="${{ secrets.DISCORD_CHANNEL_ID }}" --build-arg GOOGLE_OAUTH_CLIENT_SECRET="${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.PROJECT }}-web:latest ./frontend

      - name: Build API image
        run: |
          docker build ./api --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.PROJECT }}-api:latest

      - name: Push frontend image to registry
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.PROJECT }}-web:latest

      - name: Push API image to registry
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.PROJECT }}-api:latest
